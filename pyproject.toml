[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rockform"
version = "0.1.2"
description = "Local scan-to-print climbing hold shape prototyping"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3", "scipy>=1.14,<2", "trimesh>=4.5,<6",
  "manifold3d>=3.5.4,<4", "shapely>=2.1,<3", "rtree>=1.3,<2",
  "PySide6>=6.8,<7", "pyvista>=0.45,<0.47", "pyvistaqt>=0.11,<0.14",
  "fast-simplification>=0.1.9,<0.2", "networkx>=3.4,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
rockform = "rockform.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["rockform"]
