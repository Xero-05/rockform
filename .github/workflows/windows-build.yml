name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the tested dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps -e .
      - name: Test geometry, repairs, saving, and export
        run: python -m pytest tests/test_pipeline.py tests/test_scan_repair.py -q
      - name: Build the standalone Windows application
        run: python -m PyInstaller --noconfirm Rockform.spec
      - name: Include the team instructions
        run: |
          Copy-Item TEAM-SETUP.md dist/Rockform/
          Copy-Item README.md dist/Rockform/
          Copy-Item ROCKFORM-QUICK-START.md dist/Rockform/
      - name: Upload the Windows download
        uses: actions/upload-artifact@v4
        with:
          name: Rockform-Windows-x64
          path: dist/Rockform/
          if-no-files-found: error
          retention-days: 14
